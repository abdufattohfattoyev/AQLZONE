<!doctype html>
<html lang="uz" data-tema="bosh">
  <head>
    <meta charset="UTF-8" />

    <!--
      Temani REACT'DAN OLDIN qo'yamiz.

      Aks holda sahifa yangilanganda quyidagi bo'ladi: HTML keladi, CSS
      qo'llanadi, ekran bir lahza standart (och) rangda ko'rinadi va faqat
      shundan keyin JS ishga tushib to'g'ri temani qo'yadi. Ko'z buni "oq
      yaltirash" sifatida ilg'aydi. Manzilning o'zi kerakli temani aytib
      turibdi, shuning uchun uni shu yerdayoq aniqlaymiz.
    -->
    <script>
      (function () {
        try {
          var m = /kurs\/(\d+)-sinf/.exec(location.pathname + location.hash);
          document.documentElement.dataset.tema =
            !m ? "bosh" : (+m[1] <= 1 ? "bolalar" : "katta");
        } catch (e) { /* manzil g'alati — standart tema qoladi */ }

        // YORUG'LIK ham shu yerda. Bu SHART: agar u React ishga
        // tushgandan keyin qo'yilsa, qora rejimni tanlagan odam har
        // ochilishda bir lahza oq ekranni ko'radi — kechqurun bu
        // ko'zni qamashtiradi va aynan o'sha odam qora rejimni shuning
        // uchun tanlagan edi.
        try {
          var y = localStorage.getItem("azapp_yoruglik_v1");
          if (y !== "oq" && y !== "qora") {
            y = window.matchMedia("(prefers-color-scheme: dark)").matches ? "qora" : "oq";
          }
          document.documentElement.dataset.yoruglik = y;
        } catch (e) { /* xotira bloklangan — CSS standarti qoladi */ }

        // Til ham SHU YERDA qo'yiladi, React'dan oldin. `lang` atributi
        // brauzerning tinish belgilari, chiziqcha qo'yishi va ekran
        // o'quvchining talaffuziga ta'sir qiladi — u sahifa chizilgandan
        // keyin o'zgarsa, birinchi kadr noto'g'ri til qoidalari bilan
        // chiziladi.
        try {
          var t = localStorage.getItem("azapp_til");
          if (t !== "ru" && t !== "uz") {
            t = (navigator.language || "").toLowerCase().indexOf("ru") === 0 ? "ru" : "uz";
          }
          document.documentElement.lang = t;
        } catch (e) { /* xotira bloklangan — standart "uz" qoladi */ }
      })();
    </script>
    <!--
      Telegram Mini App ko'prigi.

      BUSIZ Mini App UMUMAN ISHLAMAYDI va nosozlik jim o'tadi: kod
      `window.Telegram.WebApp.initData` ni o'qiydi, u esa faqat shu
      skript yuklaganda paydo bo'ladi. Bo'lmasa ilova ichkarida ham
      o'zini oddiy brauzerdek tutadi — foydalanuvchini anonim deb
      hisoblab, Telegram ichida "Telegram bilan kiring" deb turadi.

      `async` YO'Q: React ishga tushganda obyekt ALLAQACHON turgan
      bo'lishi kerak, aks holda birinchi kirish qurilma id bilan ketadi
      va Telegram hisobi bog'lanmay qoladi.

      Oddiy brauzerda skript shunchaki hech narsa qilmaydi; internet
      yo'q bo'lsa yuklanmaydi va ilova avvalgidek anonim ishlayveradi.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ILOVA O'ZINI QAYERDA TANISHTIRSA, MATEMATIKA DEB TANISHTIRADI.
         Bu satrlar Google natijasida, brauzer yorlig'ida va Telegramga
         tashlangan havola ostida ko'rinadi — ya'ni ko'pchilik ilovani
         ochishdan OLDIN aynan shularni o'qiydi.

         Ilgari bu yerda "1–4-sinf" yozilgan edi. Kurs dasturi
         11-sinfgacha o'sib bo'lgan, matn esa o'sha holicha qolgan va
         havolani ko'rgan 9-sinf o'quvchisining ota-onasi "bu kichkina
         bolalar uchun ekan" deb ochmasdan o'tib ketardi.

         Matn `scripts/brend.ts` bilan qo'riqlanadi: u shu fayl,
         manifest va ilova ichidagi tanishtirish bir-biriga mos
         ekanini va sinf oralig'i kurs dasturiga to'g'ri kelishini
         tekshiradi. -->
    <title>Aql Zone — 1–11-sinf matematikasi</title>
    <meta name="description" content="Maktabgacha yoshdan 11-sinfgacha matematika, algebra va geometriya: darslik boblari bo'yicha darslar, o'yinlar, testlar va formulalar." />
    <meta name="theme-color" content="#8ed6ff" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="canonical" href="https://aql-zone.uz/" />

    <!-- Telegram va ijtimoiy tarmoqlarda havola chiroyli ko'rinsin.
         Manzillar ATAYLAB to'liq yozilgan: havolani o'qiydigan robotlar
         (Telegram, Facebook) nisbiy yo'lni ko'pincha hal qila olmaydi va
         rasm umuman ko'rinmay qoladi. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aql Zone — 1–11-sinf matematikasi" />
    <meta property="og:description" content="Maktabgacha yoshdan 11-sinfgacha matematika, algebra va geometriya. Darslar, o'yinlar, bellashuv va formulalar." />
    <meta property="og:image" content="https://aql-zone.uz/logo-toliq.svg" />
    <meta property="og:url" content="https://aql-zone.uz/" />
    <meta property="og:site_name" content="Aql Zone" />
    <meta property="og:locale" content="uz_UZ" />
    <meta name="twitter:card" content="summary" />

    <!-- Shrift so'rovi HTML bosqichidayoq boshlansin, CSS ni kutmasin -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!--
      DASTLABKI EKRAN — React'dan oldin.

      `#root` bo'sh qolsa, to'plam yuklangunicha ekranda FAQAT fon turadi.
      Tez internetda bu bir lahza, telefonda esa bir necha soniya va u
      "sayt qotib qoldi" bo'lib ko'rinadi: odam sahifani yangilaydi,
      yangilash yana shu holatga qaytaradi.

      Shu sabab belgi HTML ning o'zida turadi va DARHOL chiziladi. React
      ulanganda `createRoot` konteyner ichini o'zi tozalaydi, ya'ni buni
      olib tashlash uchun alohida kod kerak emas.
    -->
    <style>
      #az-boshlash {
        position: fixed; inset: 0; display: grid; place-items: center;
        padding: 16px;
      }
      #az-boshlash .az-quti {
        display: grid; place-items: center; gap: 10px;
        padding: 28px 32px; border-radius: 26px;
        background: #fff; box-shadow: 0 18px 40px rgb(20 30 70 / 0.10);
      }
      #az-boshlash img { width: 64px; height: 64px; }
      #az-boshlash b {
        font: 700 19px/1.2 "Baloo 2", "Fredoka", system-ui, sans-serif;
        color: #1a2450;
      }
      #az-boshlash i {
        width: 96px; height: 4px; border-radius: 4px;
        background: rgb(26 40 90 / 0.10); overflow: hidden; position: relative;
      }
      #az-boshlash i::after {
        content: ""; position: absolute; inset: 0; border-radius: 4px;
        background: #48c97a; animation: az-yur 1.1s ease-in-out infinite;
      }
      @keyframes az-yur {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      /* Harakatni o'chirgan qurilmada chiziq shunchaki turaveradi. */
      @media (prefers-reduced-motion: reduce) {
        #az-boshlash i::after { animation: none; }
      }
    </style>
    <div id="root">
      <div id="az-boshlash">
        <div class="az-quti">
          <img src="/logo.svg" alt="Aql Zone" fetchpriority="high" />
          <b>Aql Zone</b>
          <i></i>
        </div>
      </div>
    </div>
    <noscript>Aql Zone ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
