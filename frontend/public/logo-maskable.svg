<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Aql Zone">
  <!--
    Android uchun "maskable" ikonka: tizim uni doira, squircle yoki
    to'rtburchak qilib KESADI. Shuning uchun fon chetigacha to'liq (yumaloq
    burchaksiz), "AZ" esa 0.82 ga kichraytirilib markazda — kesish chizig'i
    qayerdan o'tsa ham harflar butun qoladi (xavfsiz zona: markazdan 40%).
    Shakl logo.svg bilan bir xil.
  -->
  <defs>
    <linearGradient id="azm-fon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cc6d4"/>
      <stop offset=".55" stop-color="#17b3c1"/>
      <stop offset="1" stop-color="#0e8f9b"/>
    </linearGradient>
    <linearGradient id="azm-oq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f6f8"/>
    </linearGradient>
    <linearGradient id="azm-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#azm-fon)"/>
  <g transform="translate(60 60) scale(.82) translate(-60 -59)">
    <path d="M63 32 H98 L65 88 H101" fill="none" stroke="#8a4b00" stroke-opacity=".6"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.4 3)"/>
    <path d="M63 32 H98 L65 88 H101" fill="none" stroke="url(#azm-amber)"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19 88 L42 30 L65 88 M30 69 H54" fill="none" stroke="#08636b" stroke-opacity=".55"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.4 3)"/>
    <path d="M19 88 L42 30 L65 88 M30 69 H54" fill="none" stroke="url(#azm-oq)"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
