<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="360" height="270" role="img" aria-label="Aql Zone — bilim sari har bir qadam">
  <!--
    To'liq brend blok: belgi + "AqlZone" yozuvi + shior.
    Belgining shakli logo.svg bilan AYNAN bir xil — o'zgartirsangiz ikkalasini birga.

    Yozuv <text> sifatida qoldirilgan: shrift yuklanmasa ham (masalan SVG
    <img> ichida ochilganda) o'qiladigan zaxira shriftga tushadi, rasm
    sifatida qotirilgan matn esa hech qachon tuzatib bo'lmaydigan bo'lardi.
  -->
  <defs>
    <linearGradient id="azt-a-chap" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#2f7fe4"/><stop offset="1" stop-color="#1636c4"/>
    </linearGradient>
    <linearGradient id="azt-a-ong" x1=".1" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8ee6"/><stop offset="1" stop-color="#22bd6d"/>
    </linearGradient>
    <linearGradient id="azt-shapka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8f"/><stop offset="1" stop-color="#101f52"/>
    </linearGradient>
    <linearGradient id="azt-kitob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b45a8"/><stop offset=".5" stop-color="#122f74"/><stop offset="1" stop-color="#1b45a8"/>
    </linearGradient>
    <linearGradient id="azt-zone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8ee6"/><stop offset=".55" stop-color="#22a8c0"/><stop offset="1" stop-color="#22bd6d"/>
    </linearGradient>
    <clipPath id="azt-a" clip-rule="evenodd">
      <path d="M60 28 L109 100 H11 Z M60 58 L71.5 75 H48.5 Z M44 83 H76 L80.5 91 H39.5 Z"/>
    </clipPath>

    <linearGradient id="azt-yaltir" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!--
    Animatsiya SVG ICHIDA: shunda fayl <img src="logo-toliq.svg"> sifatida
    qo'yilganda ham jonli qoladi — u yerga tashqi CSS yetib bormaydi.
    transform-box: fill-box majburiy, aks holda aylanish markazi viewBox
    boshi (0 0) bo'lib, popuk tebranish o'rniga yoy bo'ylab uchib ketadi.
  -->
  <style>
    .azt-popuk { transform-box: fill-box; transform-origin: top center;
                 animation: azt-popuk 3.1s ease-in-out infinite; }
    .azt-kitob { transform-box: fill-box; transform-origin: 50% 100%;
                 animation: azt-nafas 4.6s ease-in-out infinite; }
    .azt-yaltir { animation: azt-yaltir 5.2s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes azt-popuk { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes azt-nafas { 50% { transform: scaleY(1.07); } }
    @keyframes azt-yaltir {
      0%,62%   { transform: skewX(-14deg) translateX(0); }
      92%,100% { transform: skewX(-14deg) translateX(200px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .azt-popuk, .azt-kitob { animation: none; }
      .azt-yaltir { display: none; }
    }
  </style>

  <g transform="translate(120 6)">
    <g transform="rotate(-13 60 24)">
      <path d="M60 6 96 22 60 38 24 22Z" fill="url(#azt-shapka)"/>
      <path d="M48 29v9c0 3.4 5.4 6 12 6s12-2.6 12-6v-9l-12 5.3z" fill="#16295e"/>
      <g class="azt-popuk">
        <path d="M93.5 22.6v16" stroke="#101f52" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M93.5 37c3.4 0 5.6 2 5.6 4.6 0 3.4-2.4 7-5.6 8.6-3.2-1.6-5.6-5.2-5.6-8.6 0-2.6 2.2-4.6 5.6-4.6z" fill="#16295e"/>
      </g>
    </g>
    <g clip-path="url(#azt-a)">
      <path d="M0 0h74L34 120H0z" fill="url(#azt-a-chap)"/>
      <path d="M74 0h46v120H34z" fill="url(#azt-a-ong)"/>
      <!-- Yorug'lik shu kesim ichida — A'dan tashqariga chiqmaydi -->
      <rect class="azt-yaltir" x="-46" y="-10" width="34" height="140"
            transform="skewX(-14)" fill="url(#azt-yaltir)"/>
    </g>
    <g class="azt-kitob">
      <path d="M4 98c17-9 39-8 54 2v13c-15-10-37-11-54-4z" fill="url(#azt-kitob)"/>
      <path d="M116 98c-17-9-39-8-54 2v13c15-10 37-11 54-4z" fill="url(#azt-kitob)"/>
      <path d="M8 96c16-7 36-6 50 3M112 96c-16-7-36-6-50 3" stroke="#fff" stroke-width="2.4"
            stroke-linecap="round" fill="none" opacity=".95"/>
    </g>
  </g>

  <!--
    textLength MAJBURIY: bu fayl <img> ichida ham ochiladi, u yerda 'Baloo 2'
    yuklanmaydi va zaxira shrift kengroq chiqadi. Uzunlik qotirilmasa yozuv
    yonidagi bezak chiziqlar matn ustiga chiqib, "o'chirilgan" kabi ko'rinadi.
  -->
  <text x="180" y="200" text-anchor="middle" textLength="242" lengthAdjust="spacingAndGlyphs"
        font-family="'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif"
        font-size="66" font-weight="800" letter-spacing="-1">
    <tspan fill="#16276b">Aql</tspan><tspan fill="url(#azt-zone)">Zone</tspan>
  </text>

  <g opacity=".9">
    <!-- Shior 87..273 oralig'ida; chiziqlar 13px bo'shliq qoldirib chetda turadi -->
    <path d="M40 232h34M286 232h34" stroke="#1b45a8" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="237" text-anchor="middle" textLength="186" lengthAdjust="spacingAndGlyphs"
          font-family="'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.2" fill="#1e3a8f">
      BILIM SARI HAR BIR QADAM
    </text>
  </g>
</svg>
