<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="360" height="270" role="img" aria-label="Aql Zone — bilim sari har bir qadam">
  <!--
    To'liq brend blok: belgi + "AqlZone" yozuvi + shior.
    Belgining shakli logo.svg bilan AYNAN bir xil — o'zgartirsangiz ikkalasini birga.

    id'lar "azt-" bilan boshlanadi va bu MAJBURIY: jonli roliklar
    (`.rolik/zavod/jonli/jonli.py`) logoni HTML'ga ikki marta qo'yadi va
    "azt-" ni almashtirib id to'qnashuvining oldini oladi.

    Yozuv <text> sifatida qoldirilgan: shrift yuklanmasa ham (masalan SVG
    <img> ichida ochilganda) o'qiladigan zaxira shriftga tushadi.
  -->
  <defs>
    <linearGradient id="azt-fon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cc6d4"/>
      <stop offset=".55" stop-color="#17b3c1"/>
      <stop offset="1" stop-color="#0e8f9b"/>
    </linearGradient>
    <linearGradient id="azt-yaltir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="azt-oq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f6f8"/>
    </linearGradient>
    <linearGradient id="azt-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="azt-zone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17b3c1"/>
      <stop offset="1" stop-color="#0e8f9b"/>
    </linearGradient>
  </defs>

  <g transform="translate(120 4)">
    <rect width="120" height="120" rx="28" fill="url(#azt-fon)"/>
    <rect width="120" height="62" rx="28" fill="url(#azt-yaltir)"/>
    <path d="M63 32 H98 L65 88 H101" fill="none" stroke="#8a4b00" stroke-opacity=".6"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.4 3)"/>
    <path d="M63 32 H98 L65 88 H101" fill="none" stroke="url(#azt-amber)"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M65 30.4 H94" stroke="#fff" stroke-opacity=".6" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M19 88 L42 30 L65 88 M30 69 H54" fill="none" stroke="#08636b" stroke-opacity=".55"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.4 3)"/>
    <path d="M19 88 L42 30 L65 88 M30 69 H54" fill="none" stroke="url(#azt-oq)"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22.5 82 L41.5 34" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!--
    textLength MAJBURIY: bu fayl <img> ichida ham ochiladi, u yerda shrift
    yuklanmaydi va zaxira shrift kengroq chiqadi. Uzunlik qotirilmasa yozuv
    yonidagi bezak chiziqlar matn ustiga chiqib qolardi.
  -->
  <text x="180" y="196" text-anchor="middle" textLength="242" lengthAdjust="spacingAndGlyphs"
        font-family="'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif"
        font-size="66" font-weight="800" letter-spacing="-1">
    <tspan fill="#1f2937">Aql</tspan><tspan fill="url(#azt-zone)">Zone</tspan>
  </text>

  <g opacity=".9">
    <path d="M40 230h34M286 230h34" stroke="#17b3c1" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="235" text-anchor="middle" textLength="186" lengthAdjust="spacingAndGlyphs"
          font-family="'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.2" fill="#0e8f9b">
      BILIM SARI HAR BIR QADAM
    </text>
  </g>
</svg>
