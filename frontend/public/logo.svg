<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Aql Zone">
  <!--
    Aql Zone belgisi — brendning YAGONA manbasi (2026-10-08 dan).

    Firuza plitka, unda yonma-yon oq "A" va amber "Z": A'ning o'ng oyog'i
    va Z'ning qiya chizig'i pastda tutashadi — ikki harf bitta belgi bo'lib
    o'qiladi. "A" — doimiy qism (foydalanuvchi talabi), "Z" — urg'u.
    Ilgari belgi shapka + A + ochiq kitob edi (ko'k-yashil).

    Ranglar — loyihaning asosiy palitrasi: firuza #17b3c1 / to'q #0e8f9b /
    och #e3f6f8, amber #d97706.

    Bu shaklning nusxalari: favicon.svg, logo-maskable.svg, logo-toliq.svg,
    components/Logo.tsx, backend/core/tamga.py, apk/.../drawable/logo.xml.
    Birini o'zgartirsangiz — hammasini birga o'zgartiring.
  -->
  <defs>
    <linearGradient id="az-fon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cc6d4"/>
      <stop offset=".55" stop-color="#17b3c1"/>
      <stop offset="1" stop-color="#0e8f9b"/>
    </linearGradient>
    <linearGradient id="az-yaltir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="az-oq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f6f8"/>
    </linearGradient>
    <linearGradient id="az-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#az-fon)"/>
  <rect width="120" height="62" rx="28" fill="url(#az-yaltir)"/>

  <!-- Z (orqada — A uni pastda yopib turadi) -->
  <path d="M63 32 H98 L65 88 H101" fill="none" stroke="#8a4b00" stroke-opacity=".6"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.4 3)"/>
  <path d="M63 32 H98 L65 88 H101" fill="none" stroke="url(#az-amber)"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M65 30.4 H94" stroke="#fff" stroke-opacity=".6" stroke-width="1.8" stroke-linecap="round"/>

  <!-- A -->
  <path d="M19 88 L42 30 L65 88 M30 69 H54" fill="none" stroke="#08636b" stroke-opacity=".55"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.4 3)"/>
  <path d="M19 88 L42 30 L65 88 M30 69 H54" fill="none" stroke="url(#az-oq)"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22.5 82 L41.5 34" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
</svg>
