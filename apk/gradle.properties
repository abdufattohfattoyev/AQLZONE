# Gradle uchun xotira. 2 GB yetadi: loyihada bitta modul va bitta
# Java fayl bor, Kotlin ham, Compose ham yo'q.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Faqat o'zgargan modul qayta quriladi.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX ISHLATILMAYDI va bu ataylab.
#
# Bu ilovada bitta Activity va bitta WebView bor. AndroidX qo'shilsa,
# u o'zi bilan o'nlab kutubxona olib keladi, APK hajmi bir necha
# barobar oshadi va har qurishda tarmoq kerak bo'ladi. Tizimning o'z
# `android.app.Activity` va `android.webkit.WebView` sinflari bu ish
# uchun to'liq yetarli.
android.useAndroidX=false

# R sinfi faqat shu modulniki bo'ladi — qurish tezroq.
android.nonTransitiveRClass=true
