# Aql Zone — aql-zone.uz
#
# Serverda 80/443 portlarini ALLAQACHON boshqa nginx konteyneri ushlab
# turadi (`samsebweb-nginx-1`) va u yerda bir nechta sayt yashaydi.
# Shuning uchun bu yerda port ochilmaydi: konteyner o'sha nginx turgan
# tarmoqqa qo'shiladi va nginx unga NOMI bilan murojaat qiladi
# (`proxy_pass http://aqlzone:8000`). Port ochsak, ikki nginx bir portni
# talashib, ISHLAYOTGAN saytlar o'chib qolardi.

services:
  # ─────────────────────────── BAZA ───────────────────────────
  #
  # Postgres FAQAT ichki tarmoqda (`az-tarmoq`) turadi va port
  # ochmaydi. Ikkala sabab ham jiddiy:
  #
  #   * oldingi nginx turgan tarmoq (`web-tarmoq`) BOSHQA loyihalar
  #     bilan umumiy — u yerdagi har bir konteyner bazaga nomi bilan
  #     yeta olardi;
  #   * port ochilsa baza butun internetdan ko'rinadi va uni faqat
  #     parol qo'riqlab qolardi.
  #
  # Ya'ni bazaga faqat shu `docker-compose` dagi ikki konteyner
  # ulanadi va boshqa hech kim.
  db:
    image: postgres:17-alpine
    container_name: aqlzone_db
    environment:
      POSTGRES_DB: ${DB_NAME:-aqlzone}
      POSTGRES_USER: ${DB_USER:-aqlzone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env da sozlanmagan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - az-tarmoq
    restart: unless-stopped
    # Sog'liq tekshiruvi — `depends_on: condition` shunga qaraydi.
    # Usiz web konteyner Postgres hali ulanish qabul qilmagan paytda
    # migratsiya qilishga urinib, "connection refused" bilan
    # yiqilardi. `restart` uni ko'tarardi, lekin har joylashda bir
    # necha behuda qayta ishga tushish bo'lardi.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aqlzone} -d ${DB_NAME:-aqlzone}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ────────────────────────── NAVBAT ──────────────────────────
  #
  # Celery brokeri. Baza kabi FAQAT ichki tarmoqda va portsiz.
  #
  # Ma'lumot saqlanmaydi (volume yo'q) va bu ataylab: navbatdagi
  # vazifalar bir necha soniya yashaydi. Redis qayta ishga tushsa,
  # o'sha lahzadagi bir-ikki xabar yo'qoladi — jadval esa Beat'da,
  # ya'ni u tiklanadi. Volume qo'shish shu kichik foyda uchun yana
  # bitta kuzatiladigan joy ochardi.
  redis:
    image: redis:7-alpine
    container_name: aqlzone_redis
    # `--save ""` — diskka yozmaydi. Sabab yuqorida.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - az-tarmoq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # XIZMAT NOMI `aqlzone` BO'LISHI SHART, `web` emas.
  #
  # Compose xizmat nomini tarmoqda DNS nomi qilib ro'yxatga oladi va
  # oldindagi nginx aynan shu nom bilan murojaat qiladi
  # (`proxy_pass http://aqlzone:8000`). `container_name` ham shu nomni
  # beradi, lekin ikkalasi bir xil bo'lgani xavfsizroq: nom faqat
  # bitta joyda yozilgan bo'lsa, ikkinchisi bir kun kelib o'zgarib,
  # sayt 502 bilan yiqilardi.
  #
  # Bu ilgari serverda QO'LDA tuzatilgan edi va shu sabab `git pull`
  # har safar "local changes would be overwritten" bilan to'xtardi —
  # ya'ni joylash jimgina eski kodda qolib ketardi.
  aqlzone:
    build: .
    container_name: aqlzone
    env_file: .env
    # Migratsiyani FAQAT shu konteyner qiladi (`deploy/entrypoint.sh`).
    environment:
      AZ_ROL: web
    volumes:
      - data:/data
    networks:
      - web-tarmoq
      - az-tarmoq
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # Telegram boti — long polling. Alohida konteyner, chunki u veb
  # so'rovlarni kutmaydi va yiqilsa sayt bilan birga o'chmasligi kerak.
  bot:
    build: .
    container_name: aqlzone_bot
    command: ["python", "manage.py", "bot"]
    env_file: .env
    # Bot migratsiya QILMAYDI — `web` tugatishini kutadi. Ikkalasi
    # ham qilganda ular bir vaqtda bir jadvalni yasashga urinib,
    # biri "table already exists" bilan yiqilardi.
    environment:
      AZ_ROL: bot
    volumes:
      - data:/data
    networks:
      - web-tarmoq
      - az-tarmoq
    restart: unless-stopped
    # DIQQAT: `depends_on` faqat konteyner boshlanishini kutadi,
    # migratsiya tugashini emas. Haqiqiy kutish entrypoint ichida.
    depends_on:
      aqlzone:
        condition: service_started
      db:
        condition: service_healthy

  # ─────────────────── FON VAZIFALARI ───────────────────
  #
  # ISHCHI — vazifalarni bajaradi. Migratsiya QILMAYDI (`AZ_ROL`
  # "web" emas), `web` tugatishini kutadi.
  #
  # `--concurrency=2`: bizdagi vazifalar tarmoqni kutadi, protsessor
  # yemaydi. Ikkitasi yetadi va xotirada ~150 MB turadi; ko'proq
  # jarayon shu qadar bo'sh serverda faqat xotira yeb yotardi.
  vazifa:
    build: .
    container_name: aqlzone_vazifa
    command: ["celery", "-A", "aqlzone", "worker", "--loglevel=info", "--concurrency=2"]
    env_file: .env
    environment:
      AZ_ROL: vazifa
    volumes:
      - data:/data
    networks:
      - az-tarmoq
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # JADVAL — vazifalarni belgilangan vaqtda navbatga qo'yadi.
  #
  # Ilgari bu serverning `crontab` ida edi, ya'ni git'da yo'q edi:
  # serverni ko'chirsak jadval jimgina yo'qolardi. Endi u kodda
  # (`aqlzone/celery.py`) va joylash bilan birga keladi.
  #
  # ALOHIDA konteyner: ishchi bilan bitta jarayonda yuritish mumkin
  # (`worker -B`), lekin u paytda ishchini qayta ishga tushirish
  # jadvalni ham uzib qo'yardi. Ustiga ishchi bir nechta bo'lsa,
  # har biri o'z jadvalini yuritib, vazifalar takrorlanardi.
  jadval:
    build: .
    container_name: aqlzone_jadval
    # Jadval fayli VOLUME'da, konteyner ichida emas.
    #
    # Beat unda har vazifa oxirgi marta qachon yuborilganini
    # saqlaydi. Konteyner ichida qolsa, u har joylashda yo'qolardi
    # va Beat o'tib ketgan vaqtni "hali bajarilmagan" deb hisoblab,
    # darhol yuborardi. 18:01 da joylash qilinsa — kunlik masala
    # ikkinchi marta kanalga chiqib ketardi.
    command:
      - celery
      - -A
      - aqlzone
      - beat
      - --loglevel=info
      - --schedule=/data/celerybeat-schedule
    env_file: .env
    environment:
      AZ_ROL: jadval
    volumes:
      - data:/data
    networks:
      - az-tarmoq
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  # Yuklangan fayllar (masala rasmlari). Ilgari bu yerda SQLite
  # bazasi ham turardi — u Postgres'ga ko'chdi, lekin volume
  # QOLDIRILDI: ichida `media/` bor va eski `az-data.sqlite3` ham
  # o'sha yerda, zaxira sifatida.
  data:
  # Postgres ma'lumotlari. Konteyner qayta qurilganda ham qoladi —
  # ichida bolalarning butun progressi bor.
  pgdata:

networks:
  # Faqat shu loyihaning ichki tarmog'i: baza shu yerda turadi va
  # tashqaridan ko'rinmaydi.
  az-tarmoq:

  web-tarmoq:
    # Oldingi nginx shu tarmoqda turadi. `external` — ya'ni uni biz
    # yaratmaymiz va o'chirmaymiz; u boshqa loyihaga tegishli.
    external: true
    name: samsebweb_app-network
