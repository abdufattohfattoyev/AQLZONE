<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Sertifikat — moslashtirish</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Baloo+2:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:#1a2450}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6fb; display: flex; flex-direction: column; gap: 14px; padding: 20px 18px 22px; font-family: 'Baloo 2', system-ui, sans-serif; color: #1a2450; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 10px; min-height: 48px;">
    <a href="Sertifikat.dc.html" aria-label="Chiqish — javoblar saqlanadi" style="width: 44px; height: 44px; border-radius: 14px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 3px 0 #c4d2f0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a2450" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="flex-grow: 1; text-align: center; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">1:12:40</span>
    <a href="SertNatija.dc.html" style="display: grid; place-items: center; min-height: 44px; padding: 0 12px; border-radius: 14px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0; font-size: 14.5px; font-weight: 700; color: #2c56b8;">Yakunlash</a>
  </header>

  <div style="display: flex; align-items: baseline; justify-content: space-between;">
    <span style="font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 700;">34 <span style="color: #5f6d8e; font-size: 15px;">/ 45</span></span>
    <span style="padding: 3px 10px; border-radius: 999px; background: rgba(26,40,90,0.07); font-size: 13px; font-weight: 700; color: #4d5a86;">Moslashtirish · 2,2 ball</span>
  </div>

  <section aria-label="33–35 uchun umumiy javoblar" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; background: rgba(26,40,90,0.05);">
    <span style="font-size: 13px; font-weight: 700; color: #5f6d8e;">33–35 uchun umumiy javoblar</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{javoblar}}" as="j" hint-placeholder-count="6">
        <span style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border-radius: 12px; background: #ffffff;">
          <b style="font-family: 'Fredoka', sans-serif; color: #4d5a86;">{{j.h}}</b>
          <span style="font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 700;">{{j.q}}</span>
        </span>
      </sc-for>
    </div>
  </section>

  <div style="padding: 20px 18px; border-radius: 24px; background: #ffffff; box-shadow: inset 0 0 0 1.5px rgba(26,40,90,0.08);">
    <p style="margin: 0; font-size: 18px; line-height: 1.5;">Kvadratning perimetri 48 ga teng. Uning tomoni nechaga teng?</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; color: #4d5a86;">Savolga mos javobning harfini tanlang</span>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{harflar}}" as="h" hint-placeholder-count="6">
        <button type="button" aria-pressed="{{h.tan}}" style="{{h.uslub}}">{{h.h}}</button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <a href="SertTest.dc.html" style="display: grid; place-items: center; min-height: 54px; border-radius: 16px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0; font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 600;">Oldingi</a>
    <a href="SertOchiq.dc.html" style="display: grid; place-items: center; min-height: 54px; border-radius: 16px; background: #3b6fe0; box-shadow: 0 4px 0 #2c56b8; font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 700; color: #ffffff;">Keyingi</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const J = [['A', '12'], ['B', '16'], ['C', '24'], ['D', '36'], ['E', '48'], ['F', '144']];
    return {
      javoblar: J.map(([h, q]) => ({ h, q })),
      harflar: J.map(([h]) => {
        const t = h === 'A';
        return {
          h, tan: t ? 'true' : 'false',
          uslub: 'min-height: 52px; border: 0; border-radius: 14px; font-family: Fredoka, sans-serif; font-size: 19px; font-weight: 700; '
            + (t ? 'background: #3b6fe0; color: #ffffff; box-shadow: 0 3px 0 #2c56b8;' : 'background: #ffffff; color: #1a2450; box-shadow: 0 3px 0 #c4d2f0;'),
        };
      }),
    };
  }
}
</script>
</body>
</html>
