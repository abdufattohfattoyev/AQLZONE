<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>O'yin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Baloo+2:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:#1a2450}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6fb; display: flex; flex-direction: column; font-family: 'Baloo 2', system-ui, sans-serif; color: #1a2450; overflow: hidden;">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 20px 18px 12px; overflow: hidden;">
    <header style="display: flex; align-items: center; gap: 10px; min-height: 48px;">
      <h1 style="margin: 0; flex-grow: 1; font-family: 'Fredoka', sans-serif; font-size: 26px;">O'yin</h1>
      <span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(245,179,1,0.16); color: #8a6200; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px;"><span style="width: 16px; height: 16px; border-radius: 50%; background: #f5b301;"></span>240</span>
      <a href="Qidiruv.dc.html" aria-label="Qidiruv" style="width: 44px; height: 44px; border-radius: 14px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 3px 0 #c4d2f0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a2450" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </a>
    </header>

    <a href="Duel.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 24px; background: #3b6fe0; color: #ffffff; box-shadow: 0 5px 0 #2c56b8, 0 18px 30px -14px rgba(44,86,184,0.55);">
      <span style="width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; background: rgba(255,255,255,0.18);">
        <img src="/belgi/chaqmoq.webp" alt="" style="width: 30px; height: 30px;">
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column;">
        <span style="font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 700;">Tez o'yin</span>
        <span style="font-size: 14px; font-weight: 600; opacity: 0.92;">Duel · raqib 8 soniyada</span>
      </span>
      <span style="display: grid; place-items: center; min-height: 44px; padding: 0 16px; border-radius: 14px; background: #ffffff; color: #2c56b8; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px;">O'ynash</span>
    </a>

    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px;">
      <h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 20px;">Yakka o'yinlar</h2>
      <span style="display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; color: #5f6d8e;">
        <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 9px; height: 9px; border-radius: 50%; background: #3b6fe0;"></span>oxirgi</span>
        <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 9px; height: 9px; border-radius: 50%; background: #f5b301;"></span>rekord</span>
      </span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{oyinlar}}" as="o" hint-placeholder-count="8">
        <a href="Oyin.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 8px; border-radius: 18px; background: #ffffff; box-shadow: 0 2px 0 #c4d2f0;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <img src="{{o.ic}}" alt="" style="width: 24px; height: 24px; flex-shrink: 0;">
            <span style="font-size: 14px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{o.nom}}</span>
          </div>
          <sc-if value="{{o.bor}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; align-items: baseline; gap: 6px;">
              <span style="font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;">{{o.oxirgi}}</span>
              <span style="font-size: 12px; font-weight: 700; color: #2c56b8;">{{o.trend}}</span>
            </div>
            <svg width="100%" height="34" viewBox="0 0 140 34" preserveAspectRatio="none" role="img" aria-label="{{o.aria}}" style="display: block; overflow: visible;">
              <line x1="0" y1="31" x2="140" y2="31" stroke="rgba(26,40,90,0.1)" stroke-width="1"></line>
              <path d="{{o.maydon}}" fill="rgba(59,111,224,0.1)"></path>
              <path d="{{o.chiziq}}" fill="none" stroke="#3b6fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
              <circle cx="{{o.rx}}" cy="{{o.ry}}" r="4.5" fill="#f5b301" stroke="{{o.rHalqa}}" stroke-width="2"><title>{{o.rekordMatn}}</title></circle>
              <sc-if value="{{o.alohida}}" hint-placeholder-val="{{true}}">
                <circle cx="{{o.ox}}" cy="{{o.oy}}" r="4" fill="#3b6fe0" stroke="#ffffff" stroke-width="2"><title>{{o.oxirgiMatn}}</title></circle>
              </sc-if>
            </svg>
          </sc-if>
          <sc-if value="{{o.yoq}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 13px; color: #5f6d8e; line-height: 1.3; padding-top: 2px;">Hali o'ynalmagan</span>
            <svg width="100%" height="34" viewBox="0 0 140 34" preserveAspectRatio="none" aria-hidden="true" style="display: block;">
              <line x1="0" y1="31" x2="140" y2="31" stroke="rgba(26,40,90,0.18)" stroke-width="1.5" stroke-dasharray="3 5"></line>
            </svg>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </div>
  <dc-import name="Tab" faol="oyin" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Oxirgi 7 natija (eskidan yangiga). Bo'sh — hali o'ynalmagan.
    const O = [
      { nom: 'Tezkor hisob', ic: '/belgi/chaqmoq.webp', n: [31, 35, 33, 40, 38, 44, 48], birlik: 'ball' },
      { nom: "Ko'paytirish jadvali", ic: '/belgi/kopaytir.webp', n: [22, 25, 24, 28, 31, 27, 29], birlik: 'ball' },
      { nom: 'Ketma-ketlik', ic: '/belgi/raqamlar.webp', n: [6, 8, 7, 9, 12, 10, 11], birlik: 'ball' },
      { nom: 'Tarozi', ic: '/belgi/tarozi.webp', n: [4, 5, 5, 7, 6, 8, 9], birlik: 'ball' },
      { nom: '24 — sonlar sehri', ic: '/belgi/puzzle.webp', n: [2, 3, 2, 4, 3, 5, 4], birlik: 'ta' },
      { nom: 'Sonlar xotirasi', ic: '/belgi/miya.webp', n: [4, 5, 5, 6, 5, 7, 6], birlik: "pog'ona" },
      { nom: 'Yashirin amal', ic: '/belgi/savol.webp', n: [], birlik: 'ball' },
      { nom: 'Chamalash', ic: '/belgi/koz.webp', n: [], birlik: 'ball' },
    ];
    const W = 140, H = 34, TEPA = 5, PAST = 31;
    const oyinlar = O.map((o) => {
      if (!o.n.length) return { ...o, bor: false, yoq: true };
      const min = Math.min(...o.n), max = Math.max(...o.n);
      const x = (i) => +(i * W / (o.n.length - 1)).toFixed(1);
      const y = (v) => +(PAST - (v - min) / (max - min || 1) * (PAST - TEPA)).toFixed(1);
      const nuqtalar = o.n.map((v, i) => x(i) + ' ' + y(v));
      const ri = o.n.lastIndexOf(max), oi = o.n.length - 1;
      const farq = o.n[oi] - o.n[0];
      return {
        ...o, bor: true, yoq: false,
        oxirgi: o.n[oi],
        trend: (farq >= 0 ? '↑ +' : '↓ ') + farq + ' haftada',
        chiziq: 'M' + nuqtalar.join(' L'),
        maydon: 'M' + nuqtalar.join(' L') + ' L' + W + ' ' + PAST + ' L0 ' + PAST + ' Z',
        rx: x(ri), ry: y(max), ox: x(oi), oy: y(o.n[oi]),
        // Oxirgi natija rekordning o'zi bo'lsa — bitta oltin nuqta, ko'k halqa bilan.
        alohida: ri !== oi, rHalqa: ri === oi ? '#3b6fe0' : '#ffffff',
        rekordMatn: (ri === oi ? 'Yangi rekord: ' : 'Rekord: ') + max + ' ' + o.birlik,
        oxirgiMatn: 'Oxirgi: ' + o.n[oi] + ' ' + o.birlik,
        aria: o.nom + ', oxirgi 7 natija: ' + o.n.join(', ') + '. Rekord ' + max + '.',
      };
    });
    return { oyinlar };
  }
}
</script>
</body>
</html>
