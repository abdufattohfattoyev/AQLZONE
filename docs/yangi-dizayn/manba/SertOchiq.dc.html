<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Sertifikat — ochiq javob</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Baloo+2:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:#1a2450}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6fb; display: flex; flex-direction: column; gap: 14px; padding: 20px 18px 22px; font-family: 'Baloo 2', system-ui, sans-serif; color: #1a2450; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 10px; min-height: 48px;">
    <a href="Sertifikat.dc.html" aria-label="Chiqish — javoblar saqlanadi" style="width: 44px; height: 44px; border-radius: 14px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 3px 0 #c4d2f0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a2450" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="flex-grow: 1; text-align: center; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">0:48:03</span>
    <a href="SertNatija.dc.html" style="display: grid; place-items: center; min-height: 44px; padding: 0 12px; border-radius: 14px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0; font-size: 14.5px; font-weight: 700; color: #2c56b8;">Yakunlash</a>
  </header>

  <div style="display: flex; align-items: baseline; justify-content: space-between;">
    <span style="font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 700;">38 <span style="color: #5f6d8e; font-size: 15px;">/ 45</span></span>
    <span style="padding: 3px 10px; border-radius: 999px; background: rgba(26,40,90,0.07); font-size: 13px; font-weight: 700; color: #4d5a86;">Ochiq javob · 3,2 ball</span>
  </div>

  <div style="padding: 20px 18px; border-radius: 24px; background: #ffffff; box-shadow: inset 0 0 0 1.5px rgba(26,40,90,0.08);">
    <p style="margin: 0; font-size: 18px; line-height: 1.5;">f(x) = 2x² − 8x + 3 funksiya berilgan.</p>
  </div>

  <sc-for list="{{qismlar}}" as="q" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <b style="font-family: 'Fredoka', sans-serif; font-size: 17px;">{{q.h}})</b>
        <span style="flex-grow: 1; font-size: 16px; line-height: 1.4;">{{q.matn}}</span>
        <span style="font-size: 12.5px; font-weight: 700; color: #5f6d8e; white-space: nowrap;">{{q.ball}}</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button type="button" aria-label="Ishorani almashtirish" style="width: 56px; min-height: 54px; border: 0; border-radius: 14px; background: rgba(26,40,90,0.07); font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: #1a2450;">±</button>
        <label for="{{q.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">{{q.h}}) Javob</label>
        <input id="{{q.id}}" type="text" inputmode="decimal" value="{{q.qiymat}}" placeholder="Javob" style="flex-grow: 1; min-width: 0; min-height: 54px; padding: 0 16px; border: 2px solid {{q.chegara}}; border-radius: 14px; background: #ffffff; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: #1a2450;">
      </div>
    </div>
  </sc-for>
  <p style="margin: 0; font-size: 13px; color: #5f6d8e;">Faqat son yozing. Kasrni vergul bilan: 2,5</p>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <a href="SertMoslash.dc.html" style="display: grid; place-items: center; min-height: 54px; border-radius: 16px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0; font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 600;">Oldingi</a>
    <a href="SertNatija.dc.html" style="display: grid; place-items: center; min-height: 54px; border-radius: 16px; background: #3b6fe0; box-shadow: 0 4px 0 #2c56b8; font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 700; color: #ffffff;">Keyingi</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      qismlar: [
        { id: 'qa', h: 'a', matn: 'f(0) ni toping.', ball: '1,5 ball', qiymat: '3', chegara: '#3b6fe0' },
        { id: 'qb', h: 'b', matn: 'Funksiyaning eng kichik qiymatini toping.', ball: '1,7 ball', qiymat: '', chegara: 'rgba(26,40,90,0.15)' },
      ],
    };
  }
}
</script>
</body>
</html>
