<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Men</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Baloo+2:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:#1a2450}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6fb; display: flex; flex-direction: column; font-family: 'Baloo 2', system-ui, sans-serif; color: #1a2450; overflow: hidden;">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px 18px 12px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 24px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0;">
      <span style="width: 60px; height: 60px; border-radius: 50%; background: rgba(59,111,224,0.12); color: #2c56b8; display: grid; place-items: center; font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; flex-shrink: 0;">DR</span>
      <span style="flex-grow: 1; display: flex; flex-direction: column;">
        <span style="font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 700;">Dilnoza Rahimova</span>
        <span style="font-size: 14px; color: #5f6d8e;">3-sinf o'quvchisi</span>
      </span>
      <button type="button" style="min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: rgba(26,40,90,0.07); font-size: 14px; font-weight: 700; color: #2c56b8;">Almashtirish</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: 18px; background: #ffffff; box-shadow: 0 2px 0 #c4d2f0;">
        <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: #8a6200;">124</span><span style="font-size: 13px; color: #5f6d8e;">yulduz</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: 18px; background: #ffffff; box-shadow: 0 2px 0 #c4d2f0;">
        <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: #8a6200;">240</span><span style="font-size: 13px; color: #5f6d8e;">tanga</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: 18px; background: #ffffff; box-shadow: 0 2px 0 #c4d2f0;">
        <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700;">5 kun</span><span style="font-size: 13px; color: #5f6d8e;">zanjir</span>
      </div>
    </div>

    <sc-for list="{{guruhlar}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 6px;">
        <h2 style="margin: 0; padding-left: 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5f6d8e;">{{g.nom}}</h2>
        <div style="display: flex; flex-direction: column; border-radius: 20px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0; overflow: hidden;">
          <sc-for list="{{g.qatorlar}}" as="q" hint-placeholder-count="3">
            <a href="{{q.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border-top: {{q.chiziq}};">
              <img src="{{q.ic}}" alt="" style="width: 28px; height: 28px;">
              <span style="flex-grow: 1; font-size: 16px; font-weight: 600;">{{q.nom}}</span>
              <span style="font-size: 14px; color: #5f6d8e;">{{q.qiymat}}</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f6d8e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
  <dc-import name="Tab" faol="men" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = [
      { nom: 'Yutuqlar', qatorlar: [
        { nom: 'Reyting', qiymat: '#12 sinfda', href: 'Reyting.dc.html', ic: '/belgi/chart.webp' },
        { nom: 'Nishonlar', qiymat: '7 / 30', href: 'Men.dc.html', ic: '/belgi/miya.webp' },
        { nom: "Do'kon", qiymat: '', href: 'Men.dc.html', ic: '/belgi/palette.webp' },
      ] },
      { nom: 'Ota-ona uchun', qatorlar: [
        { nom: 'Ota-ona paneli', qiymat: 'Haftalik hisobot', href: 'OtaOna.dc.html', ic: '/belgi/vazifa.webp' },
        { nom: 'Bolalar profillari', qiymat: '2 ta', href: 'Men.dc.html', ic: '/belgi/menyu.webp' },
      ] },
      { nom: 'Sozlamalar', qatorlar: [
        { nom: 'Til', qiymat: "O'zbekcha", href: 'Men.dc.html', ic: '/belgi/xarita.webp' },
        { nom: "Yorug'lik", qiymat: 'Avto', href: 'Men.dc.html', ic: '/belgi/koz.webp' },
      ] },
    ];
    return {
      guruhlar: G.map((g) => ({ ...g, qatorlar: g.qatorlar.map((q, i) => ({ ...q, chiziq: i ? '1px solid rgba(26,40,90,0.08)' : '0' })) })),
    };
  }
}
</script>
</body>
</html>
