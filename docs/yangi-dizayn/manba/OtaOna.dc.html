<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ota-ona paneli</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Baloo+2:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:#1a2450}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6fb; display: flex; flex-direction: column; gap: 14px; padding: 20px 18px 24px; font-family: 'Baloo 2', system-ui, sans-serif; color: #1a2450; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 12px; min-height: 48px;">
    <a href="Men.dc.html" aria-label="Orqaga" style="width: 44px; height: 44px; border-radius: 14px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 3px 0 #c4d2f0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a2450" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Fredoka', sans-serif; font-size: 23px;">Ota-ona paneli</h1>
  </header>

  <div style="display: flex; gap: 8px;">
    <span style="display: grid; place-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; background: #3b6fe0; color: #ffffff; font-size: 14.5px; font-weight: 700;">Dilnoza · 3-sinf</span>
    <span style="display: grid; place-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; background: #ffffff; color: #4d5a86; font-size: 14.5px; font-weight: 600; box-shadow: 0 2px 0 #c4d2f0;">Aziz · 4 yosh</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 18px; background: #ffffff; box-shadow: 0 2px 0 #c4d2f0;"><span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700;">5 / 7</span><span style="font-size: 13px; color: #5f6d8e;">kun faol</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 18px; background: #ffffff; box-shadow: 0 2px 0 #c4d2f0;"><span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700;">23</span><span style="font-size: 13px; color: #5f6d8e;">dars</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 18px; background: #ffffff; box-shadow: 0 2px 0 #c4d2f0;"><span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: #178a52;">86%</span><span style="font-size: 13px; color: #5f6d8e;">to'g'ri</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 22px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0;">
    <h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 18px;">Bu hafta, daqiqa</h2>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 120px;">
      <sc-for list="{{kunlar}}" as="k" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%;">
          <span style="font-size: 12px; font-weight: 700; color: #4d5a86;">{{k.m}}</span>
          <span style="{{k.style}}"></span>
        </div>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 12.5px; color: #5f6d8e;">
      <span>Du</span><span>Se</span><span>Ch</span><span>Pa</span><span>Ju</span><span>Sh</span><span>Ya</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 22px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0;">
    <h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 18px;">Yordam kerak bo'lgan mavzu</h2>
    <p style="margin: 0; font-size: 15px; color: #4d5a86;">Qoldiqli bo'lish — 10 ta urinishdan 4 tasi to'g'ri.</p>
    <a href="Dars.dc.html" style="align-self: flex-start; display: grid; place-items: center; min-height: 40px; padding: 0 14px; border-radius: 12px; background: rgba(59,111,224,0.1); color: #2c56b8; font-size: 14.5px; font-weight: 700;">Darsni ochish</a>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border-radius: 20px; background: #ffffff; box-shadow: 0 3px 0 #c4d2f0;">
    <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 15.5px; font-weight: 700;">Haftalik hisobot Telegram'ga</span><span style="font-size: 13px; color: #5f6d8e;">Har yakshanba 20:00</span></span>
    <button type="button" role="switch" aria-checked="true" aria-label="Haftalik hisobot" style="width: 52px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: #22b06b; position: relative; flex-shrink: 0;"><span style="position: absolute; right: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #ffffff;"></span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const M = [18, 25, 0, 32, 14, 40, 22];
    return {
      kunlar: M.map((m) => ({
        m: m || '',
        style: 'display: block; width: 100%; border-radius: 8px; height: ' + Math.max(6, Math.round(m / 40 * 86)) + 'px; background: ' + (m ? '#3b6fe0' : 'rgba(26,40,90,0.1)') + ';',
      })),
    };
  }
}
</script>
</body>
</html>
