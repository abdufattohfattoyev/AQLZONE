<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Pastki panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Baloo+2:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:#1a2450}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<nav aria-label="Asosiy bo'limlar" style="width: 390px; height: 84px; box-sizing: border-box; padding: 8px 10px 14px; background: #ffffff; border-top: 1px solid rgba(26,40,90,0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; font-family: 'Baloo 2', system-ui, sans-serif;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<a href="{{it.href}}" style="{{it.style}}">
<img src="{{it.ic}}" alt="" style="width: 28px; height: 28px; object-fit: contain; {{it.imgStyle}}">
<span style="font-size: 12.5px; font-weight: 700; line-height: 1;">{{it.nom}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"faol":{"editor":"enum","options":["bugun","oqish","oyin","masalalar","men"],"default":"bugun"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const faol = this.props.faol ?? 'bugun';
    const T = [
      { id: 'bugun', nom: 'Bugun', href: 'Bugun.dc.html', ic: '/belgi/uy.webp' },
      { id: 'oqish', nom: "O'qish", href: 'Oqish.dc.html', ic: '/belgi/map.webp' },
      { id: 'oyin', nom: "O'yin", href: 'Oyin.dc.html', ic: '/belgi/oyin.webp' },
      { id: 'masalalar', nom: 'Masalalar', href: 'Masalalar.dc.html', ic: '/belgi/pencil.webp' },
      { id: 'men', nom: 'Men', href: 'Men.dc.html', ic: '/belgi/menyu.webp' },
    ];
    return {
      items: T.map((t) => {
        const on = t.id === faol;
        return {
          ...t,
          style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; border-radius: 16px; '
            + (on ? 'background: rgba(59,111,224,0.1); color: #2c56b8;' : 'color: #5f6d8e;'),
          imgStyle: on ? '' : 'opacity: 0.75;',
        };
      }),
    };
  }
}
</script>
</body>
</html>
